spring.application.name=multi-threaded-file-processing-system
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web=DEBUG
spring.servlet.multipart.location=/tmp/spring-uploads
spring.servlet.multipart.file-size-threshold=2MB
file.processing.timeout.validation=30
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr(%logger{20}){blue} %clr(:){faint} %msg%n
spring.security.user.name=izhar
spring.security.user.password={noop}izhar
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.datasource.driver-class-name=org.h2.Driver
spring.security.user.roles=USER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/api-docs
spring.servlet.multipart.enabled=true
server.tomcat.max-part-count=20






